# Controller bindings and rendering. Edit and restart ./run.sh; no rebuild is needed.
# Button names use SDL's A/B/X/Y layout, including the Logitech F310.
# Use "none" to disable a binding. Omitted entries keep the built-in defaults.
# Button actions: confirm, cancel, fire, full_collective, hover, previous_weapon,
# next_weapon, cockpit, chase, toggle_view, pause, gear, menu_up, menu_down,
# menu_left, menu_right, collective_down, collective_up, chaff, flares, none.
# Collective +/- changes power by 10% per step; holding repeats the action.
# Chaff and flares deploy once per press; holding does not repeat them.

[buttons]
a = confirm
b = cancel
x = chaff
y = flares
leftshoulder = collective_down
rightshoulder = collective_up
leftstick = gear
rightstick = next_weapon
back = toggle_view
start = pause
dpup = menu_up
dpdown = menu_down
dpleft = menu_left
dpright = menu_right

[axes]
# Axis actions: roll, pitch, rudder, collective, fire, hover, chaff, flares, none.
leftx = roll
lefty = pitch
rightx = rudder
righty = collective
lefttrigger = hover
righttrigger = fire
# Prefix an axis action with - to invert it, e.g. lefty = -pitch.

[settings]
# Axis thresholds: 0..32766; deadzone: 0..30000.
deadzone = 6000
trigger_threshold = 16000
axis_button_threshold = 12000
repeat_delay_ms = 350
# Repeat intervals are in milliseconds (30..2000).
repeat_interval_ms = 120
throttle_repeat_ms = 200
fire_repeat_ms = 100

[rendering]
# native: high-resolution world; original: original 320x200 renderer.
renderer = native
# gpu: OpenGL scene rendering; cpu: preserved software renderer.
backend = gpu
# Native canvas size is 320x200 multiplied by this value (1..8).
render_scale = 8
# original keeps the game's distance cutoffs; extended draws distant models.
visibility = extended
show_fps = false
# Optional visual upgrades. Set false for the original palette/ground path.
lighting = true
runway_textures = true
terrain_textures = true
# Visual terrain elevation and smooth hills; requires prepared terrain assets.
terrain_relief = true
shadows = true
military_paint = true
surface_detail = true
rotor_blades = true
runway_detail = true
# Smooth native world edges and thin details; retain original cockpit/HUD pixels.
antialiasing = true
# Give round smoke particles proper occlusion against solid scenery.
sphere_depth = true
# Blend the satellite ground edge and distant scenery into the horizon.
atmosphere = true
replacement_models = true
models_dir = bin/enhanced/models
photo_skies = true
sky_dir = bin/enhanced/sky
# Run tools/import_terrain.py once to prepare the optional satellite images.
terrain_dir = bin/enhanced/terrain
# Command-line rendering options override these values.
