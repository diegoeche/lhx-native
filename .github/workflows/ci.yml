name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    env:
      SDL_VIDEODRIVER: offscreen
      SDL_AUDIODRIVER: dummy
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libgl-dev libgl1-mesa-dri
      - name: Audit public source contents
        run: python tools/package_source.py --check
      - name: Run source tests without game files
        run: python -m unittest discover -s tests -v
      - name: Check CPU arithmetic helpers
        run: |
          cc -std=c11 -I third_party/pcrecomp/runtime tests/cpu_arithmetic.c -o /tmp/lhx-cpu-tests
          /tmp/lhx-cpu-tests
